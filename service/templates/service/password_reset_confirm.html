{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha | HigiFlow</title>
    <link rel="stylesheet" href="{% static 'service/css/dashboard.css' %}?v=20260601-quote-create-1">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel login-panel-form" aria-label="Nova senha">
            <div class="login-form-stack">
                <header class="login-heading">
                    <h1>Nova senha</h1>
                    <p>Crie uma nova senha para voltar a acessar o HigiFlow.</p>
                </header>

                <section class="login-card">
                    {% if validlink %}
                        <form class="login-form" method="post">
                            {% csrf_token %}
                            {{ form.non_field_errors }}
                            <label class="login-field">
                                <span>Nova senha</span>
                                <span class="login-input-wrap">
                                    <input type="password" name="{{ form.new_password1.name }}" autocomplete="new-password" required>
                                </span>
                                {{ form.new_password1.errors }}
                            </label>
                            <label class="login-field">
                                <span>Confirmar senha</span>
                                <span class="login-input-wrap">
                                    <input type="password" name="{{ form.new_password2.name }}" autocomplete="new-password" required>
                                </span>
                                {{ form.new_password2.errors }}
                            </label>
                            <button type="submit" class="login-submit">Salvar nova senha</button>
                        </form>
                    {% else %}
                        <p class="login-access-copy">Este link expirou ou já foi usado.</p>
                        <a href="{% url 'password_reset' %}" class="login-submit text-center">Solicitar outro link</a>
                    {% endif %}
                </section>
            </div>
        </section>
    </main>
</body>
</html>
