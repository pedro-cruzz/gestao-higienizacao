{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | HigiFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'service/css/dashboard.css' %}?v=20260601-quote-create-1">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel login-panel-form" aria-label="Recuperar senha">
            <div class="login-form-stack">
                <header class="login-heading">
                    <h1>Recuperar senha</h1>
                    <p>Informe o email do seu acesso para receber o link de redefinicao.</p>
                </header>

                <section class="login-card" aria-label="Formulario de recuperacao">
                    <form class="login-form" method="post">
                        {% csrf_token %}
                        {{ form.email.errors }}
                        <label class="login-field">
                            <span>Email</span>
                            <span class="login-input-wrap">
                                <i class="bi bi-envelope"></i>
                                <input type="email" name="{{ form.email.name }}" value="{{ form.email.value|default_if_none:'' }}" placeholder="voce@empresa.com" autocomplete="email" required autofocus>
                            </span>
                        </label>
                        <button type="submit" class="login-submit">Enviar link</button>
                    </form>

                    <p class="login-access-copy">
                        <a href="{% url 'login' %}">Voltar ao login</a>
                    </p>
                </section>
            </div>
        </section>

        <section class="login-panel login-panel-brand" aria-label="HigiFlow">
            <div class="login-brand-content">
                <img class="login-brand-logo" src="{% static 'service/img/higiflow-logo.png' %}" alt="HigiFlow">
                <h2>Acesso seguro</h2>
                <p>O link de recuperacao expira automaticamente por seguranca.</p>
            </div>
        </section>
    </main>
</body>
</html>
